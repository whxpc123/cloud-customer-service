# 公共配置供第一至九章共享；knowledge 配置按环境追加数据库能力。
server:
  # 可用 SERVER_PORT 覆盖；页面与 API 同端口，默认避开本机已占用的常用端口。
  port: ${SERVER_PORT:18080}

app:
  ai:
    # 完整消息和返回文本可能包含客户数据，默认关闭；本地调试显式开启。
    log-payload: ${AI_LOG_PAYLOAD:false}

spring:
  # 前六章与离线测试不依赖数据库；knowledge profile 显式启用以下自动配置。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  application:
    name: cloud-customer-service
  ai:
    model:
      # 第六章默认以 document 角色做语义实验，知识适配器另区分入库 document 与搜索 query。
      embedding: dashscope
    dashscope:
      # 按本项目约定使用 DASHSCOPE_API_KEY，不使用文章中的 AI_DASHSCOPE_API_KEY。
      api-key: ${DASHSCOPE_API_KEY}
      # 聊天模型负责自然语言生成及结构化意图；每个 ChatClient 另设自己的用途提示词。
      chat:
        options:
          model: qwen-plus
      embedding:
        options:
          model: text-embedding-v4
          # 向量长度必须与知识库 vector(1024) 列匹配；改模型或维度需重新生成整套向量。
          dimensions: 1024
          text-type: document

# BeanOutputConverter 的转换异常日志可能包含完整模型输出；服务层另记不含原文的元数据。
logging:
  level:
    org.springframework.ai.converter.BeanOutputConverter: OFF
    # 学习时打印类型生成的 Schema/格式说明；设置 INTENT_SCHEMA_LOG_LEVEL=INFO 可关闭。
    com.example.cloudcustomerservice.intent.CustomerIntentRecognizer: ${INTENT_SCHEMA_LOG_LEVEL:DEBUG}

    # 此版本 SDK 的异常日志包含输入原文；实验服务另记数量、维度、耗时和异常类型。
    com.alibaba.cloud.ai.dashscope.embedding.DashScopeEmbeddingModel: OFF

# 第十三章只配置业务空间根地址，沿用已有 DASHSCOPE_API_KEY；空值时明确降级。
---
spring:
  config:
    activate:
      on-profile: "local & knowledge"
app:
  ai:
    rerank:
      base-url: ${DASHSCOPE_RERANK_BASE_URL:}
