# 第十八章本机 Nginx 参考配置；需自行提供 Nginx，本项目未安装它，也未把本机登录接口开放到公网。
# nginx -p /path/to/temporary-prefix/ -c /absolute/path/to/this-file
pid nginx.pid;
error_log error.log;
events { worker_connections 128; }
http {
    access_log off;
    server {
        listen 127.0.0.1:18081;
        location / {
            proxy_pass http://127.0.0.1:18080;
            proxy_http_version 1.1;
            # 保留浏览器原 Host（含端口），让同源 Origin 检查一致；不要配置绕过身份验证。
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 60s;
            gzip off;
        }
    }
}
